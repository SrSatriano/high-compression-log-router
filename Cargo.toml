[package]
name = "log_router"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "log_router"
path = "src/main.rs"

[[bin]]
name = "bench_compression"
path = "src/bin/bench_compression.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zstd = "0.13"
lz4_flex = "0.11"
